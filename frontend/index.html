<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved or system theme before the first paint, including auth loading.
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('cornagent-theme'); } catch { /* Optional storage. */ }
        const theme = saved === 'dark' || saved === 'light' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101112' : '#ffffff';
      })();
    </script>
    <!--app-metadata:start--><!--app-metadata:end-->
  </head>
  <body>
    <div id="root"><!--app-content:start--><!--app-content:end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
